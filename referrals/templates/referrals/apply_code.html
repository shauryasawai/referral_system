{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apply Referral Code — Referral Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{% static 'css/main.css' %}">
</head>
<body>
<div class="page-narrow">
  <div class="brand" style="justify-content:center;margin-bottom:24px"><span class="brand-mark">R</span> Referral Hub</div>
  <div class="card">
    <div class="card-head">
      <h2>Apply a referral code</h2>
      <p class="subtext">Enter your details and referral code to unlock your discount.</p>
    </div>
    <form id="f">
      <label for="id_name">Your name</label>
      <input type="text" id="id_name" name="name" required>
      <label for="id_email">Your email</label>
      <input type="email" id="id_email" name="email" required>
      <label for="id_product">Product</label>
      <select id="id_product" name="product" required>
        <option value="">Select product</option>
        {% for value, label in products %}<option value="{{ value }}">{{ label }}</option>{% endfor %}
      </select>
      <label for="id_code">Referral code</label>
      <input type="text" id="id_code" name="code" placeholder="e.g. PTR-AB12CD" required>
      <button type="submit" style="width:100%;margin-top:20px">Apply code</button>
    </form>
    <div id="result"></div>
  </div>
</div>
<script>
document.getElementById('f').addEventListener('submit', async function(e){
  e.preventDefault();
  const res = await fetch("{% url 'apply_referral_code' %}", {method:"POST", body:new FormData(e.target)});
  const data = await res.json();
  const box = document.getElementById('result');
  box.className = 'show ' + (res.ok ? 'ok' : 'err');
  box.textContent = res.ok ? `${data.message} — ${data.discount_percent}% discount applied` : data.error;
});
</script>
</body>
</html>
