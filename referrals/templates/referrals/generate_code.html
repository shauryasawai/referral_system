<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"><title>Get Your Referral Code</title>
<style>
body{font-family:Arial,sans-serif;max-width:420px;margin:60px auto;color:#222}
input,select,button{width:100%;padding:10px;margin:6px 0;box-sizing:border-box}
button{background:#2563eb;color:#fff;border:0;border-radius:4px;cursor:pointer}
#result{margin-top:16px;padding:12px;border-radius:4px}
.ok{background:#e6f4ea;color:#166534}
.err{background:#fde8e8;color:#991b1b}
</style>
</head>
<body>
<h2>Get Your Referral Code</h2>
<form id="f">
  <input name="name" placeholder="Your name" required>
  <input name="email" type="email" placeholder="Your email" required>
  <select name="product" required>
    <option value="">Select product</option>
    {% for value, label in products %}<option value="{{ value }}">{{ label }}</option>{% endfor %}
  </select>
  <button type="submit">Generate Code</button>
</form>
<div id="result"></div>
<script>
document.getElementById('f').addEventListener('submit', async function(e){
  e.preventDefault();
  const res = await fetch("{% url 'generate_customer_code' %}", {method:"POST", body:new FormData(e.target)});
  const data = await res.json();
  const box = document.getElementById('result');
  if(res.ok){
    box.className='ok';
    box.textContent = `Your code: ${data.code} — ${data.discount_percent}% discount`;
  } else {
    box.className='err';
    box.textContent = data.error;
  }
});
</script>
</body>
</html>
